<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6ee">
  <title>动物骑行队</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #203c35;
      --muted: #62766d;
      --paper: #f5f6ee;
      --white: #fffef9;
      --leaf: #2f6a50;
      --leaf-dark: #245540;
      --line: #d4ddd1;
      --coral: #e98263;
      font-family: "Aptos", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 4%, rgba(255,255,255,.9), transparent 32rem),
        var(--paper);
    }

    .page {
      width: min(100% - 64px, 1280px);
      margin: 0 auto;
      padding: 36px 0 30px;
    }

    .topline {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 720;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .segmented {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,254,249,.82);
    }

    button {
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .rider-choice {
      min-width: 78px;
      height: 38px;
      padding: 0 13px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      font-size: 14px;
      font-weight: 650;
      transition: color .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .rider-choice[aria-pressed="true"] {
      color: #fffef9;
      background: var(--leaf);
      box-shadow: 0 2px 5px rgba(30, 75, 53, .18);
    }

    .motion-toggle {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      transition: background .2s ease, border-color .2s ease;
    }

    .motion-toggle:hover { background: #edf2e8; border-color: #b7c9b8; }
    .motion-toggle:focus-visible, .rider-choice:focus-visible { outline: 3px solid #e89a70; outline-offset: 2px; }
    .motion-toggle svg { width: 19px; height: 19px; fill: currentColor; }

    .stage-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 7px;
      background: #cbe9e8;
      box-shadow: 0 18px 48px rgba(36, 67, 51, .12), 0 2px 8px rgba(36,67,51,.08);
    }

    .ride-scene {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 25 / 14;
    }

    .ride-scene[hidden] { display: none; }
    .paused .motion { animation-play-state: paused !important; }

    .cloud { animation: cloud-drift 34s linear infinite; }
    .cloud.slow { animation-duration: 48s; }
    .water-sparkle { animation: shimmer 3.8s ease-in-out infinite alternate; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: wheel-spin 1.5s linear infinite; }
    .pedal-spin { transform-box: view-box; transform-origin: 500px 397px; animation: wheel-spin .92s linear infinite; }
    .road-dashes { animation: road-drift 2s linear infinite; }
    .rider-bob { transform-box: fill-box; transform-origin: center; animation: rider-bob .72s ease-in-out infinite alternate; }
    .leg-front { transform-box: view-box; transform-origin: 490px 312px; animation: leg-pedal .92s ease-in-out infinite alternate; }
    .leg-back { transform-box: view-box; transform-origin: 490px 312px; animation: leg-pedal .92s ease-in-out infinite alternate-reverse; }
    .tail-sway { transform-box: view-box; transform-origin: 433px 275px; animation: tail-sway 1.7s ease-in-out infinite alternate; }

    @keyframes wheel-spin { to { transform: rotate(360deg); } }
    @keyframes road-drift { to { stroke-dashoffset: -92px; } }
    @keyframes cloud-drift { from { transform: translateX(-18px); } to { transform: translateX(22px); } }
    @keyframes shimmer { from { opacity: .2; } to { opacity: .68; } }
    @keyframes rider-bob { from { transform: translateY(-1px) rotate(-.3deg); } to { transform: translateY(2px) rotate(.3deg); } }
    @keyframes leg-pedal { from { transform: rotate(-10deg); } to { transform: rotate(12deg); } }
    @keyframes tail-sway { from { transform: rotate(-2deg); } to { transform: rotate(3deg); } }

    @media (max-width: 700px) {
      .page { width: min(100% - 32px, 600px); padding-top: 22px; }
      .topline { align-items: start; flex-direction: column; gap: 16px; margin-bottom: 16px; }
      h1 { font-size: 25px; }
      .subtitle { margin-top: 5px; font-size: 14px; }
      .toolbar { width: 100%; justify-content: space-between; }
      .rider-choice { min-width: 82px; }
      .stage-wrap { border-radius: 5px; }
      .ride-scene { min-height: 210px; object-fit: cover; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .rider-choice, .motion-toggle { transition: none; }
    }
  </style>
</head>

    const pauseIcon = '<path d="M7 5h4v14H7zM15 5h4v14h-4z"/>';
    const playIcon = '<path d="M8 5.8c0-1.2 1.3-1.9 2.3-1.2l9.1 6.2a1.5 1.5 0 0 1 0 2.4l-9.1 6.2A1.5 1.5 0 0 1 8 18.2z"/>';
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let paused = reducedMotion.matches;

    function setPaused(next) {
      paused = next;
      app.classList.toggle("paused", paused);
      motionToggle.setAttribute("aria-pressed", String(paused));
      motionToggle.setAttribute("aria-label", paused ? "继续动画" : "暂停动画");
      motionToggle.title = paused ? "继续动画" : "暂停动画";
      motionToggle.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${paused ? playIcon : pauseIcon}</svg>`;
    }

    choices.forEach((button) => {
      button.addEventListener("click", () => {
        const selected = button.dataset.rider;
        choices.forEach((choice) => choice.setAttribute("aria-pressed", String(choice === button)));
        Object.entries(scenes).forEach(([name, scene]) => { scene.hidden = name !== selected; });
      });
    });

    motionToggle.addEventListener("click", () => setPaused(!paused));
    setPaused(paused);
  </script>
</body>
</html>
